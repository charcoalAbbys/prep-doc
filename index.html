<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rubrik Prep & DSA Docs Explorer</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --sidebar-bg: #ffffff;
      --border-color: #e0e0e0;
      --text-color: #202124;
      --hover-bg: #e8f0fe;
      --accent-color: #1a73e8;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg-color); color: var(--text-color); }
    #sidebar { width: 340px; border-right: 1px solid var(--border-color); background: var(--sidebar-bg); padding: 20px; box-sizing: border-box; overflow-y: auto; }
    #main { flex: 1; display: flex; flex-direction: column; background: #fff; }
    iframe { width: 100%; height: 100%; border: none; }
    h2 { font-size: 1.1rem; color: #5f6368; margin-top: 0; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .tree-folder { font-weight: 600; color: #3c4043; margin-top: 14px; margin-bottom: 6px; font-size: 0.95rem; }
    .nested { margin-left: 14px; border-left: 2px solid #f1f3f4; padding-left: 8px; }
    .tree-item { font-size: 0.9rem; margin: 4px 0; cursor: pointer; color: #3c4043; padding: 8px 10px; border-radius: 6px; transition: background 0.15s ease; display: flex; align-items: center; gap: 8px; }
    .tree-item:hover { background: var(--hover-bg); color: var(--accent-color); }
    .tree-item.active { background: var(--hover-bg); color: var(--accent-color); font-weight: 600; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>📂 Workspace Directory</h2>
    
    <div class="tree-folder">📁 Interview Loops</div>
    <div class="nested">
      <div class="tree-folder">📁 Rubrik Preparation</div>
      <div class="nested">
        <div class="tree-item active" onclick="openDoc(this, 'https://docs.google.com/document/d/13JpUh2rumrWBY9rX2KXcVz9ZuHXHOBNdVZea79iJgyc/edit?usp=drive_web')">
          📄 Interview Log & Tracker (V2)
        </div>
        <div class="tree-item" onclick="openDoc(this, 'https://docs.google.com/document/d/1SRM7yDVnG0UrjUGAFf2sJA3Ima4xVFxUyFrCXF8vqRM/edit?usp=drive_web')">
          📄 Rubrik Questions Overview (V2)
        </div>
      </div>
    </div>
  </div>

  <div id="main">
    <iframe id="doc-viewer" src="https://docs.google.com/document/d/13JpUh2rumrWBY9rX2KXcVz9ZuHXHOBNdVZea79iJgyc/edit?usp=drive_web"></iframe>
  </div>

  <script>
    function openDoc(element, url) {
      document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      document.getElementById('doc-viewer').src = url;
    }
  </script>

</body>
</html>
